name: Mane Pro 4K — Nderto IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Ndertimi i IPA (iPhone/iPad)
    runs-on: macos-14
    steps:
      - name: Marr kodin
        uses: actions/checkout@v4

      - name: Instalo XcodeGen
        run: |
          set -euo pipefail
          if command -v xcodegen >/dev/null 2>&1; then
            echo "XcodeGen tashme i pranishem"
          else
            echo "Shkarkoj XcodeGen direkt nga GitHub releases (me i shpejte se brew)..."
            if curl -fsSL "https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip" -o /tmp/xg.zip; then
              unzip -qo /tmp/xg.zip -d /tmp/ || true
              XG="$(find /tmp -type f -name xcodegen -perm -111 2>/dev/null | head -1 || true)"
              if [ -n "$XG" ]; then
                sudo mkdir -p /usr/local/bin
                sudo cp "$XG" /usr/local/bin/xcodegen
              fi
            fi
            if ! command -v xcodegen >/dev/null 2>&1; then
              echo "Skedari direkt s'punoi — provoj me Homebrew..."
              brew install xcodegen
            fi
          fi
          xcodegen --version

      - name: Gjenero projektin Xcode (format i lexueshem nga Xcode 15)
        run: |
          set -euo pipefail
          xcodegen generate
          PBX="ManePro4K.xcodeproj/project.pbxproj"
          echo "Formati i gjeneruar: $(grep -m1 'objectVersion' "$PBX" || echo 'i panjohur')"
          sed -i '' 's/objectVersion = [0-9]*/objectVersion = 56/' "$PBX"
          echo "Formati pas rregullimit: $(grep -m1 'objectVersion' "$PBX")"
          echo "=== Skemat e projektit ==="
          xcodebuild -list -project ManePro4K.xcodeproj || true

      - name: Nderto aplikacionin (Release, pa nenshkrim)
        run: |
          ST=0
          ST2=0
          echo "=== Prova 1: me scheme ==="
          xcodebuild \
            -project ManePro4K.xcodeproj \
            -scheme ManePro4K \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DD \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log | tail -n 80 || ST=$?
          if [ "$ST" -ne 0 ]; then
            echo ""
            echo "=== Prova 2: me target (rezerve) ==="
            xcodebuild \
              -project ManePro4K.xcodeproj \
              -target ManePro4K \
              -configuration Release \
              -sdk iphoneos \
              SYMROOT=build/DD/Build/Products \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              build 2>&1 | tee xcodebuild-target.log | tail -n 80 || ST2=$?
          fi
          if [ "$ST" -ne 0 ] && [ "$ST2" -ne 0 ]; then
            echo ""
            echo "❌ Te dyja provat e ndertimit deshtuan!"
            exit 1
          fi

      - name: Paketo IPA-n (e panenshkruar)
        run: |
          set -euo pipefail
          APP="$(find build -type d -name 'ManePro4K.app' | head -1 || true)"
          if [ -z "$APP" ]; then
            echo "❌ ManePro4K.app nuk u gjet — ndertimi deshtoi!"
            echo "=== GABIMET ==="
            grep -iE "error:" xcodebuild.log xcodebuild-target.log 2>/dev/null | head -40 || true
            exit 1
          fi
          echo "U gjet: $APP"
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          (cd build && zip -qry ../ManePro4K-1.9.0-unsigned.ipa Payload)
          ls -lh *.ipa

      - name: Nenshkruaj IPA-n (opsionale — vetem me secrets te certifikates)
        env:
          SIGNING_CERT_P12_BASE64: ${{ secrets.SIGNING_CERT_P12_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: bash scripts/sign.sh

